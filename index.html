<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Recibo — SISECON</title>
<style>
  :root{
    --azul:#4c6d92;
    --azul-escuro:#334d66;
    --azul-soft:#edf3f8;
    --linha:#222;
    --cinza:#6b7280;
    --bg:#edf1f5;
    --bg-2:#e3e8ef;
    --painel-bg:rgba(255,255,255,.9);
    --painel-text:#171d2a;
    --campo-text:#171d2a;
    --campo-bg:#f8fafc;
    --campo-border:#d7dde5;
    --label-color:#1f2a37;
    --btn-sec-bg:#eef3f8;
    --btn-sec-text:#1f2937;
    --theme-btn-bg:rgba(15,23,42,.05);
    --theme-btn-border:rgba(15,23,42,.1);
    --theme-btn-color:#1f2937;
    --recibo-bg:#fff;
    --recibo-text:#111;
    --recibo-line:#222;
    --recibo-muted:#1a1a1a;
    --panel-shadow:0 14px 30px rgba(15, 23, 42, .06);
  }
  body[data-theme="dark"]{
    --bg:#0f151b;
    --bg-2:#141d26;
    --painel-bg:rgba(19,25,31,.9);
    --painel-text:#e6ebf1;
    --campo-text:#edf3f9;
    --campo-bg:#1a232b;
    --campo-border:#2c3945;
    --label-color:#dfe8f0;
    --btn-sec-bg:#1d2a33;
    --btn-sec-text:#edf3f9;
    --theme-btn-bg:rgba(255,255,255,.03);
    --theme-btn-border:rgba(255,255,255,.08);
    --theme-btn-color:#edf3f9;
    --preview-bg:#111a22;
    --recibo-bg:#121b22;
    --recibo-text:#e7edf3;
    --recibo-line:rgba(255,255,255,.62);
    --recibo-muted:#dfe8f0;
    --panel-shadow:0 16px 38px rgba(2, 6, 23, .32);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--painel-text);
  }
  .wrap{
    max-width:1680px;
    margin:0 auto;
    padding:26px 18px 60px;
    display:grid;
    grid-template-columns:minmax(440px, 520px) minmax(0, 1fr);
    gap:30px;
    align-items:start;
  }
  h1{
    font-size:clamp(24px, 2.15vw, 31px);
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-.05em;
    font-weight:800;
    max-width:100%;
    word-break:break-word;
  }
  .subtitulo{font-size:14px; color:var(--cinza); margin:0 0 20px; font-weight:500;}

  /* ---------- FORM ---------- */
  .painel{
    background:var(--painel-bg);
    color:var(--painel-text);
    border:1px solid rgba(148,163,184,.16);
    border-radius:18px;
    padding:22px 20px 20px;
    box-shadow:var(--panel-shadow);
    height:fit-content;
    backdrop-filter:blur(8px);
  }
  .campo{margin-bottom:18px;}
  .campo label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    margin-bottom:8px;
    color:var(--label-color);
    letter-spacing:.01em;
  }
  .campo-inline{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .campo-inline input{flex:1;}
  .btn-mini{
    width:36px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    color:var(--campo-text);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-mini:hover{
    transform:translateY(-1px);
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 8px 18px rgba(0,0,0,.12);
  }
  .campo input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--campo-border);
    border-radius:12px;
    font-size:13.5px;
    background:var(--campo-bg);
    color:var(--campo-text);
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .campo input::placeholder,
  .linha-item input::placeholder{color:rgba(148,163,184,.85);}
  .campo input:focus,
  .linha-item input:focus{outline:none; border-color:var(--azul); box-shadow:0 0 0 3px rgba(18,89,184,.15);}

  .linha-item{
    display:grid;
    grid-template-columns: minmax(0, 1.5fr) 90px 104px;
    gap:10px;
    align-items:end;
    margin-bottom:12px;
  }
  .linha-item .rotulo{
    font-size:12.8px;
    padding-bottom:10px;
    color:var(--label-color);
    font-weight:600;
  }
  .linha-item input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--campo-border);
    border-radius:10px;
    font-size:13px;
    background:var(--campo-bg);
    color:var(--campo-text);
    font-variant-numeric: tabular-nums;
  }
  .cab-itens{
    display:grid;
    grid-template-columns: minmax(0, 1.5fr) 90px 104px;
    gap:10px;
    font-size:11px;
    color:var(--cinza);
    margin:18px 0 8px;
    border-top:1px solid rgba(148,163,184,.2);
    padding-top:12px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .rodape-form{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:12px;
  }
  .btns{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn-limpar-wrap{
    margin-top:10px;
    display:flex;
    justify-content:flex-end;
  }
  .btn-link{
    border:none;
    background:transparent;
    color:var(--label-color);
    font-size:12.5px;
    font-weight:600;
    padding:0;
    cursor:pointer;
    opacity:.8;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.01em;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn-primaria{
    background:linear-gradient(135deg, var(--azul) 0%, var(--azul-escuro) 100%);
    color:#fff;
    box-shadow:0 8px 18px rgba(20, 35, 48, .14), inset 0 1px 0 rgba(255,255,255,.12);
    position:relative;
  }
  .btn-primaria::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(circle at 50% 10%, rgba(255,255,255,.18), transparent 38%);
    opacity:.6;
    pointer-events:none;
  }
  .btn-primaria:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 22px rgba(20, 35, 48, .18), inset 0 1px 0 rgba(255,255,255,.14);
    filter:brightness(1.02);
  }
  .btn-secundaria{
    background:var(--btn-sec-bg);
    color:var(--btn-sec-text);
    border:1px solid rgba(148,163,184,.18);
    box-shadow:0 4px 12px rgba(15, 23, 42, .03), inset 0 1px 0 rgba(255,255,255,.03);
    position:relative;
  }
  .btn-secundaria::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 60%);
    opacity:.7;
    pointer-events:none;
  }
  .btn-secundaria:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(15,23,42,.05), inset 0 1px 0 rgba(255,255,255,.04);
    filter:brightness(1.01);
  }
  .toggle-vias{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; margin-top:14px; color:var(--label-color);
  }
  .theme-toggle{
    position:fixed;
    right:20px;
    top:18px;
    z-index:30;
    width:38px;
    height:38px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,.72);
    color:#111827;
    border:1px solid rgba(15,23,42,.08);
    box-shadow:0 8px 18px rgba(15,23,42,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    transition:transform .2s ease, opacity .2s ease, border-color .2s ease, background .2s ease;
    opacity:.88;
  }
  body[data-theme="dark"] .theme-toggle{
    background:rgba(15,23,42,.78);
    color:#e5edf7;
    border-color:rgba(255,255,255,.09);
    box-shadow:0 8px 18px rgba(2,6,23,.28);
  }
  .theme-toggle:hover{transform:translateY(-1px); opacity:1;}
  .theme-toggle:focus-visible{outline:2px solid var(--azul); outline-offset:2px;}

  /* ---------- RECIBO / PRÉVIA ---------- */
  .preview-area{min-width:0;width:100%;}
  #folha{
    background:var(--preview-bg, #fff);border:1px solid rgba(148,163,184,.14);border-radius:18px;box-shadow:0 12px 24px rgba(15,23,42,.06);
    padding:16px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;
  }
  #pagina-preview{width:29.7cm;height:21cm;flex:0 0 auto;transform-origin:center top;display:block;margin:0 auto;}
  .pagina{display:flex;width:29.7cm;height:21cm;margin:0;padding:0;gap:0;justify-content:center;align-items:flex-start;}
  .recibo{
    width:14.85cm;height:21cm;padding:1.05cm .45cm .45cm 1.35cm;
    font-size:12.2px;line-height:1.2;border-right:1px dashed rgba(148,163,184,.7);
    box-sizing:border-box;flex:0 0 14.85cm;overflow:hidden;
    background:var(--recibo-bg);
    color:var(--recibo-text);
  }
  .pagina .recibo:last-child{border-right:none;}
  .cabecalho{display:flex;gap:.55cm;align-items:flex-start;height:2.55cm;margin-bottom:.18cm;}
  .logo{flex-shrink:0;width:5.25cm;}
  .logo img{width:100%;height:auto;display:block;}
  .info-empresa{flex:1;font-size:9.4px;line-height:1.38;padding-top:0;white-space:nowrap;color:var(--recibo-text);}
  .info-empresa b{display:block;font-size:9.4px;color:var(--recibo-text);}
  .linha-firma{display:flex;gap:4px;font-size:13.8px;margin:.05cm 0 .08cm;border-bottom:1px solid var(--recibo-line);padding-bottom:1px;line-height:1.2;color:var(--recibo-text);}
  .linha-firma b{white-space:nowrap;font-weight:700;color:var(--recibo-text);}.linha-firma span{flex:1;min-width:0;font-weight:700;color:var(--recibo-text);}
  .frase-pagou{font-size:12.2px;margin:.08cm 0 .03cm;color:var(--recibo-text);}
  .linha-ref{display:flex;font-size:12.2px;margin-bottom:.08cm;gap:4px;align-items:flex-end;color:var(--recibo-text);}
  .linha-ref b{white-space:nowrap;color:var(--recibo-text);}.linha-ref span{flex:1;border-bottom:1px solid var(--recibo-line);text-align:center;font-weight:600;padding-bottom:1px;min-width:0;color:var(--recibo-text);}
  .item{display:flex;align-items:flex-end;height:.67cm;font-size:12.2px;margin:0;gap:3px;line-height:1;color:var(--recibo-text);}
  .item .nome{white-space:nowrap;color:var(--recibo-text);}
  .item .competencia{flex:1;min-width:20px;text-align:center;border-bottom:1px solid var(--recibo-line);font-weight:600;padding-bottom:1px;color:var(--recibo-text);}
  .item .competencia.vazio{color:transparent;font-weight:400;}
  .item .rs{white-space:nowrap;margin-left:2px;color:var(--recibo-text);}
  .item .valor{width:72px;text-align:right;border-bottom:1px solid var(--recibo-line);font-weight:600;padding-bottom:1px;color:var(--recibo-text);}
  .item .valor.vazio{color:transparent;font-weight:400;}
  .total{text-align:right;font-size:13.5px;font-weight:800;margin:.25cm 0 .15cm;padding-right:.05cm;color:var(--recibo-text);}
  .total span{display:inline-block;min-width:80px;border-bottom:1px solid var(--recibo-line);text-align:center;color:var(--recibo-text);}
  .linha-data{font-size:12.2px;margin:.06cm 0 .72cm;text-align:right;white-space:nowrap;color:var(--recibo-text);}
  .linha-data span{display:inline-block;border-bottom:1px solid var(--recibo-line);text-align:center;color:var(--recibo-text);}
  .linha-assinatura{border-top:1px solid var(--recibo-line);width:9.2cm;margin:0 0 .06cm auto;}
  .assinatura{text-align:center;font-size:10.5px;width:9.2cm;margin-left:auto;color:var(--recibo-text);}

  @media print{
    html,body{width:29.7cm;height:21cm;margin:0;padding:0;background:#fff!important;color:#111!important;}
    body[data-theme="dark"]{
      --bg:#fff; --painel-bg:#fff; --painel-text:#111; --campo-text:#111; --campo-bg:#fff; --campo-border:#999; --label-color:#111; --btn-sec-bg:#fff; --btn-sec-text:#111; --theme-btn-bg:#fff; --theme-btn-border:#ccc; --theme-btn-color:#111; --preview-bg:#fff; --recibo-bg:#fff; --recibo-text:#111; --recibo-line:#111; --recibo-muted:#111;
    }
    .painel,.subtitulo,h1,.btns,.toggle-vias,.theme-toggle{display:none!important;}
    .wrap{display:block;width:29.7cm;max-width:none;margin:0;padding:0;}
    .preview-area{width:29.7cm;height:21cm;margin:0;padding:0;}
    #folha{width:29.7cm;height:21cm;padding:0;margin:0;display:block;overflow:hidden;box-shadow:none;border-radius:0;background:#fff;}
    #pagina-preview{width:29.7cm;height:21cm;transform:none!important;}
    .pagina{display:flex;flex-direction:row;width:29.7cm;height:21cm;margin:0;padding:0;gap:0;}
    .recibo{width:14.85cm;min-width:14.85cm;max-width:14.85cm;height:21cm;min-height:21cm;flex:0 0 14.85cm;box-sizing:border-box;overflow:hidden;background:#fff!important;color:#111!important;}
    .info-empresa,.info-empresa b,.linha-firma,.linha-firma b,.linha-firma span,.frase-pagou,.linha-ref,.linha-ref b,.linha-ref span,.item,.item .nome,.item .competencia,.item .rs,.item .valor,.total,.total span,.linha-data,.linha-data span,.assinatura{color:#111!important;}
    .linha-firma,.linha-firma b,.linha-firma span,.linha-ref span,.item .competencia,.item .valor,.total span,.linha-data span,.linha-assinatura{border-color:#111!important;}
    .pagina .recibo:last-child{border-right:none;}
    @page{size:A4 landscape;margin:0 10mm 0 5mm;}
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===================== FORMULÁRIO ===================== -->
  <div class="painel">
    <h1>Gerador de Recibo — SISECON</h1>
    <p class="subtitulo">Preencha os dados e clique em Imprimir / Salvar PDF.</p>

    <div class="campo">
      <label>A Firma</label>
      <div class="campo-inline">
        <input type="text" id="firma" placeholder="Nome da empresa cliente" list="empresas-sugeridas">
        <button type="button" class="btn-mini" id="salvarEmpresa" title="Salvar empresa para sugestões" aria-label="Salvar empresa">+</button>
      </div>
      <datalist id="empresas-sugeridas"></datalist>
    </div>
    <div class="campo">
      <label>Referente a (mês/ano)</label>
      <input type="text" id="referente" placeholder="Ex: Agosto/2026">
    </div>

    <div class="cab-itens">
      <div>Item</div><div>Compet.</div><div>Valor R$</div>
    </div>
    <div id="lista-itens"></div>

    <div class="campo" style="margin-top:10px;">
      <label>Total R$</label>
      <input type="text" id="totalManual" placeholder="0,00">
    </div>

    <div class="rodape-form">
      <div class="campo"><label>Dia</label><input type="text" id="dia" placeholder="__"></div>
      <div class="campo"><label>Mês</label><input type="text" id="mes" placeholder="Setembro"></div>
      <div class="campo"><label>Ano</label><input type="text" id="ano" placeholder="2026"></div>
    </div>

    <label class="toggle-vias">
      <input type="checkbox" id="duasVias" checked>
      Imprimir 2 vias lado a lado (como o modelo original)
    </label>

    <div class="btns">
      <button type="button" class="btn-primaria" onclick="imprimirRecibo()">Imprimir</button>
      <button type="button" class="btn-secundaria" onclick="baixarPdf()">Baixar PDF</button>
    </div>
    <div class="btn-limpar-wrap">
      <button type="button" class="btn-link" onclick="limpar()">Limpar campos</button>
    </div>
  </div>

  <button type="button" class="theme-toggle" id="toggleTema" aria-label="Alternar tema" title="Alternar tema" onclick="toggleTema()">☀</button>

  <!-- ===================== PREVIEW / RECIBO ===================== -->
  <div class="preview-area">
    <div id="folha">
      <div id="pagina-preview">
        <div class="pagina" id="pagina"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY_EMPRESAS = 'empresasReciboSisecon';

function carregarEmpresasSalvas(){
  try {
    const lista = JSON.parse(localStorage.getItem(STORAGE_KEY_EMPRESAS) || '[]');
    return Array.isArray(lista) ? lista.filter(v => typeof v === 'string' && v.trim()) : [];
  } catch {
    return [];
  }
}

function salvarEmpresasNoStorage(empresas){
  localStorage.setItem(STORAGE_KEY_EMPRESAS, JSON.stringify(empresas));
}

function atualizarListaEmpresas(){
  const lista = document.getElementById('empresas-sugeridas');
  if(!lista) return;
  const empresas = carregarEmpresasSalvas();
  lista.innerHTML = '';
  empresas.forEach(nome => {
    const option = document.createElement('option');
    option.value = nome;
    lista.appendChild(option);
  });
}

function salvarEmpresaAtual(){
  const input = document.getElementById('firma');
  if(!input) return;
  const valor = input.value.trim();
  if(!valor){
    input.focus();
    return;
  }

  const empresas = carregarEmpresasSalvas();
  const jaExiste = empresas.some(nome => nome.toLowerCase() === valor.toLowerCase());
  if(!jaExiste){
    empresas.unshift(valor);
    salvarEmpresasNoStorage(empresas.slice(0, 30));
    atualizarListaEmpresas();
  }

  input.focus();
  input.select();
}

document.getElementById('salvarEmpresa')?.addEventListener('click', salvarEmpresaAtual);
document.getElementById('firma')?.addEventListener('keydown', function(event){
  if(event.key === 'Enter' && !event.shiftKey){
    const empresas = carregarEmpresasSalvas();
    const valor = this.value.trim();
    if(valor && !empresas.some(nome => nome.toLowerCase() === valor.toLowerCase())){
      event.preventDefault();
      salvarEmpresaAtual();
    }
  }
});

const itens = [
"IPI","ICMS","ISS","Imposto de Renda","Simples","INSS Empregado",
"INSS Empregador","FGTS","PIS","Honorários","COFINS","Contrib. Social",
"Livros e Autenticação","Registro de Firma","Alteração de Firma",
"Material de Expediente","Carimbo","Contrib. Sindical","Outras Despesas"
];
const itensComCompetenciaMonetaria = new Set([
  'ICMS', 'ISS', 'Imposto de Renda', 'Simples', 'PIS', 'COFINS', 'Contrib. Social', 'Outras Despesas'
]);

const listaItensEl = document.getElementById('lista-itens');
itens.forEach((nome, i) => {
  const row = document.createElement('div');
  row.className = 'linha-item';
  const placeholder = itensComCompetenciaMonetaria.has(nome) ? '0,00' : 'mm/aa';
  row.innerHTML = `
    <div class="rotulo">${nome}</div>
    <input type="text" id="comp-${i}" placeholder="${placeholder}">
    <input type="text" id="valor-${i}" placeholder="0,00">
  `;
  listaItensEl.appendChild(row);
});

function formatarCompetencia(valor){
  let numeros = valor.replace(/\D/g, '').slice(0, 4);
  if(numeros.length > 2) numeros = numeros.slice(0, 2) + '/' + numeros.slice(2);
  return numeros;
}

const mesesDoAno = [
 'Janeiro','Fevereiro','Março','Abril','Maio','Junho',
 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'
];

function obterMesNumero(valor){
 if(!valor) return null;
 const texto = String(valor).trim().toLowerCase();
 const numero = Number.parseInt(texto.replace(/\D/g, ''), 10);
 if(!Number.isNaN(numero) && numero >= 1 && numero <= 12) return numero - 1;
 const indice = mesesDoAno.findIndex(m => m.toLowerCase() === texto || m.slice(0, 3).toLowerCase() === texto);
 return indice >= 0 ? indice : null;
}

function mesPosterior(valor){
 const indice = obterMesNumero(valor);
 if(indice === null) return '';
 const proximo = (indice + 1) % 12;
 return mesesDoAno[proximo];
}

function formatarReferente(valor){
 let texto = valor.replace(/[^a-zA-ZÀ-ÿ0-9/ ]/g, '').replace(/\s+/g, ' ').replace(/^\s+/, '').trim();
 if(!texto) return '';

 if(texto.includes('/')){
   const partes = texto.split('/');
   const mes = (partes[0] || '').trim();
   const ano = (partes.slice(1).join('/')).trim();

   const mesFormatado = mes ? mes.replace(/\s+/g, '').replace(/[^a-zA-ZÀ-ÿ0-9]/g, '') : '';
   const anoFormatado = ano ? ano.replace(/\D/g, '').slice(0, 4) : '';

   if(mesFormatado && !anoFormatado) return `${mesFormatado}/`;
   if(!mesFormatado && anoFormatado) return `/${anoFormatado}`;
   if(mesFormatado && anoFormatado) return `${mesFormatado}/${anoFormatado}`;
   return '/';
 }

 return texto;
}

function formatarMoeda(valor){
  let numeros = valor.replace(/\D/g, '');
  if(!numeros) return '';
  numeros = numeros.replace(/^0+(?=\d)/, '');
  if(numeros.length === 1) numeros = '0' + numeros;
  const centavos = numeros.slice(-2);
  const inteiros = numeros.slice(0, -2) || '0';
  return inteiros.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + centavos;
}

document.getElementById('firma').addEventListener('input', function(){
  this.value = this.value;
});
document.getElementById('mes').addEventListener('input', function(){
  this.value = this.value;
});
document.getElementById('referente').addEventListener('input', function(){
  this.value = formatarReferente(this.value);
  const referente = this.value || '';
  const match = referente.match(/([A-Za-zÀ-ÿ0-9]+)\s*\/\s*(\d{0,4})/);
  if(!match) return;
  const mesValor = match[1];
  const anoValor = match[2];
  const proximo = mesPosterior(mesValor);
  const mesEl = document.getElementById('mes');
  const anoEl = document.getElementById('ano');
  if(proximo && mesEl) mesEl.value = proximo;
  if(anoValor && anoEl) anoEl.value = anoValor;
});
document.getElementById('totalManual').addEventListener('input', function(){
  this.value = formatarMoeda(this.value);
});

const camposTexto = Array.from(document.querySelectorAll('input[type="text"]'));
const botaoImprimir = document.querySelector('.btn-primaria');
camposTexto.forEach((campo, indice) => {
  campo.addEventListener('keydown', function(event){
    if(event.key !== 'Enter') return;
    event.preventDefault();
    const proximo = camposTexto[indice + 1];
    if(proximo){
      proximo.focus();
      if(typeof proximo.select === 'function') proximo.select();
      return;
    }
    if(botaoImprimir){
      botaoImprimir.click();
    }
  });
});
itens.forEach((nome, i) => {
  const compInput = document.getElementById(`comp-${i}`);
  compInput.addEventListener('input', function(){
    if(itensComCompetenciaMonetaria.has(nome)){
      this.value = formatarMoeda(this.value);
      return;
    }
    this.value = formatarCompetencia(this.value);
  });
  document.getElementById(`valor-${i}`).addEventListener('input', function(){
    this.value = formatarMoeda(this.value);
  });
});

function ajustarPreview(){
  const folha=document.getElementById('folha');
  const paginaPreview=document.getElementById('pagina-preview');
  if(!folha||!paginaPreview) return;
  const larguraPagina=1123;
  const larguraDisponivel=Math.max(180, folha.clientWidth - 20);
  const escala=Number(Math.min(1, Math.max(0.18, larguraDisponivel / larguraPagina)).toFixed(4));
  paginaPreview.style.transform=`scale(${escala})`;
  paginaPreview.style.transformOrigin='top center';
  paginaPreview.style.height=`${21 * escala}cm`;
  paginaPreview.style.width=`${29.7}cm`;
}
window.addEventListener('resize',ajustarPreview);

function atualizar(){
  const duasVias = document.getElementById('duasVias').checked;
  const reciboHtml = montarRecibo();
  document.getElementById('pagina').innerHTML = duasVias ? (reciboHtml + reciboHtml) : reciboHtml;
  requestAnimationFrame(ajustarPreview);
}

function imprimirRecibo(){
  window.print();
}

function obterNomeArquivoPdf(){
  const empresa = (document.getElementById('firma')?.value || '').trim();

  const palavrasIgnoradas = new Set([
    'e', 'da', 'de', 'do', 'das', 'dos', 'ltda', 'ltda', 's/a', 'sa', 's', 'comercio', 'comércio', 'empresa', 'restaurante', 'churrascaria', 'bar', 'cafe', 'cafeteria', 'hotel', 'pizzaria', 'mercado', 'padaria', 'lanche', 'burger'
  ]);

  const empresaSlug = (() => {
    const texto = (empresa || 'empresa')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/&/g, ' e ')
      .replace(/[^a-zA-Z0-9\s-]/g, ' ')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();

    const palavras = texto.split(' ').filter(Boolean);
    const base = palavras
      .filter(p => !palavrasIgnoradas.has(p))
      .slice(0, 3)
      .join('-');

    const normalizado = (base || palavras.slice(0, 3).join('-'))
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 24);

    return (normalizado || 'empresa')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  })();

  let mesNumero = '';
  const referenteCampo = (document.getElementById('referente')?.value || '').trim();
  const mesCampo = (document.getElementById('mes')?.value || '').trim();

  const candidatos = [referenteCampo, mesCampo];

  for (const candidato of candidatos) {
    if (!candidato) continue;
    const texto = String(candidato).trim();

    const matchMesAno = texto.match(/(?:^|\D)(\d{1,2})\s*\/\s*(\d{2,4})?(?:\D|$)/);
    if (matchMesAno) {
      const mes = Number.parseInt(matchMesAno[1], 10);
      if (mes >= 1 && mes <= 12) {
        mesNumero = String(mes).padStart(2, '0');
        break;
      }
    }

    const matchNumero = texto.match(/(\d{1,2})/);
    if (matchNumero) {
      const mes = Number.parseInt(matchNumero[1], 10);
      if (mes >= 1 && mes <= 12) {
        mesNumero = String(mes).padStart(2, '0');
        break;
      }
    }

    const indice = mesesDoAno.findIndex(m => {
      const nome = texto.toLowerCase();
      return nome === m.toLowerCase() || nome.startsWith(m.slice(0, 3).toLowerCase()) || nome.includes(m.toLowerCase());
    });

    if (indice >= 0) {
      mesNumero = String(indice + 1).padStart(2, '0');
      break;
    }
  }

  const nomeArquivo = `recibo-${empresaSlug}${mesNumero ? `-${mesNumero}` : ''}.pdf`;
  return nomeArquivo;
}

async function baixarPdf(){
  const alvo = document.getElementById('folha');
  if(!alvo){
    alert('Não foi possível localizar a área do recibo para exportar.');
    return;
  }

  if(typeof html2canvas === 'undefined' || !window.jspdf || !window.jspdf.jsPDF){
    alert('A exportação para PDF não está disponível neste momento. Tente novamente mais tarde.');
    return;
  }

  try {
    const canvas = await html2canvas(alvo, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'mm',
      format: 'a4'
    });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const image = canvas.toDataURL('image/png');
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    pdf.addImage(image, 'PNG', 0, 0, imgWidth, imgHeight);
    pdf.save(obterNomeArquivoPdf());
  } catch (erro) {
    console.error('Erro ao gerar PDF:', erro);
    alert('Não foi possível gerar o PDF automaticamente. Use o botão de imprimir e escolha “Salvar como PDF”.');
  }
}

function limpar(){
  document.querySelectorAll('input[type="text"]').forEach(el => el.value = '');
  document.getElementById('duasVias').checked = true;
  atualizar();
}

function aplicarTema(theme){
  const tema = theme === 'dark' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', tema);
  const btn = document.getElementById('toggleTema');
  if(btn){
    btn.innerHTML = tema === 'dark' ? '☀' : '☾';
    btn.setAttribute('aria-label', tema === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro');
    btn.setAttribute('title', tema === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro');
  }
  requestAnimationFrame(ajustarPreview);
  localStorage.setItem('temaRecibo', tema);
}

function toggleTema(){
  const atual = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  aplicarTema(atual);
}

document.querySelectorAll('input').forEach(el => el.addEventListener('input', atualizar));
const temaSalvo = localStorage.getItem('temaRecibo') || 'light';
atualizarListaEmpresas();
aplicarTema(temaSalvo);
atualizar();
</script>
